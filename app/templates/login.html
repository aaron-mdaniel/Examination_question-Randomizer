{% extends "base.html" %}
{% block title %}Sign in | Exam Randomizer{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 mb-3">Sign in</h1>
  <form method="post" class="card card-body">
    <label class="form-label" for="username">Username</label>
    <input class="form-control mb-3" id="username" name="username" required>
    <label class="form-label" for="password">Password</label>
    <input class="form-control mb-3" type="password" id="password" name="password" required>
    <button class="btn btn-primary">Sign in</button>
  </form>
  <p class="text-muted small mt-3">Development teacher: <code>teacher</code> / <code>ChangeMe123!</code></p>
  <p class="text-danger small">Change or remove the development account before deploying this application.</p>
</div></div>
{% endblock %}
