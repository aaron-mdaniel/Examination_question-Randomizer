{% extends "base.html" %}
{% block title %}Create exam | Exam Randomizer{% endblock %}
{% block content %}
<h1 class="h2 mb-3">Create exam configuration</h1>
<form method="post" class="card card-body">
  <div class="mb-3"><label class="form-label">Exam title</label><input class="form-control" name="title" placeholder="e.g. DBMS Unit Test 1" required></div>
  <div class="mb-3"><label class="form-label">Subject</label><input class="form-control" name="subject" placeholder="Must match question-bank subject" required></div>
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Number of questions</label><input class="form-control" type="number" min="1" name="question_count" value="10" required></div>
    <div class="col-md-4"><label class="form-label">Duration (minutes)</label><input class="form-control" type="number" min="1" name="duration_minutes" value="30" required></div>
    <div class="col-md-4"><label class="form-label">Difficulty</label><select class="form-select" name="difficulty"><option value="any">Any difficulty</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div>
  </div>
  <div class="mt-4"><button class="btn btn-primary">Save exam</button></div>
</form>
{% endblock %}
